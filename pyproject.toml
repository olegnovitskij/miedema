[project]
name = "miedema"
version = "0.1.0"
description = "Miedema enthalpy calculation program"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.4.2",
    "openpyxl>=3.0.10",
    "matplotlib>=3.5.0",
    "kivy>=2.1.0",
    "kivymd>=1.1.1",
    "ase>=3.22.0",
    "pyxtal>=0.5.3",
    "scikit-learn>=1.1.0",
    "scipy>=1.9.0",
    "kivy-garden.matplotlib>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miedema"]

